    <h1>Calculadora</h1>
    <h3>¡Bienvenidos a la mejor calculadora!</h3>
    <img src="img/calculadora.png" alt="Calculadora" width="200" height="200" id="calculadora">
    <br>
     <div class="primera">
        <div class="segundo">
            <h1>Crear cuenta</h1>
            <center>
                <p>Cree su cuenta para guardar sus datos :3</p>
                <input type="text" id="nuevoUsuario" placeholder="Crear usuario">
                <br>
                <input type="password" id="nuevaContrasena" placeholder="Crear contraseña">
                <br>
                <button onclick="registrar()">Registrarse</button>
                <p id="mensaje1"></p>
            </center>
        </div>


        <div class="principal">
            <h1>Inicio de Sesión</h1>
            <center>
                <p>Ingrese su usuario y contraseña para poder continuar :O</p>
                <input type="text" id="usuario" placeholder="Nombre de usuario">
                <br>
                <input type="password" id="contrasena" placeholder="Contraseña">
                <br>
                <button onclick="iniciarSesion()">Iniciar Sesión</button>
                <p id="mensaje2"></p>
            </center>
        </div>
    </div>
